<?xml version="1.0" encoding="UTF-8"?>
<!-- Oh-My-Pi (omp) brand mark — gradient "π" on a dark rounded tile. Full-color
     (NOT currentColor, unlike Cursor/Cline/Grok), so it keeps its own fills.
     width/height="100%" added so it fills the 1em icon slot like the other
     inline SVGs (source SVG had no width/height attrs, which would default to
     300x150 and overflow). Source: omp.sh mark (desktop icon source). -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="100%" height="100%">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ed4abf" />
      <stop offset=".5" stop-color="#9b4dff" />
      <stop offset="1" stop-color="#5ad8e6" />
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="12" fill="#0f0a14" />
  <path fill="url(#g)" d="M14 16h36v8H40v32h-8V24h-6v22h-8V24h-4z" />
</svg>
